<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Dolman Preview Studio</title><link rel="icon" href="data:,">
<style>:root{color-scheme:dark}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d1117;color:#e6edf3;font:15px/1.5 "JetBrains Mono",ui-monospace,Consolas,monospace}

<body><div class="box"><h1>Dolman Preview Studio</h1><p id="m">Opening the studio…</p><div class="bar" title="Downloading the studio"><i id="b"></i></div><p class="err" id="e" role="alert"></p></div>
<script>
const D={k:"fpJQCIAvS7dLUGEJyyFbSuR+MsEsbjkvkrZw/+HFR60=",b:"20261021-185956-dfa045",u:"m/studio.bin",p:{"bf": "m/bf.bin", "bffal": "m/bffal.bin", "bflln": "m/bflln.bin", "hero": "m/hero.bin", "pages-dolman": "m/pages-dolman.bin", "pages-fal": "m/pages-fal.bin", "pages-lln": "m/pages-lln.bin"},latest:"https://raw.githubusercontent.com/georgemoreas2025/dps-e05c9dbc/main/latest.json"};
const u=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0)),E=document.getElementById('e'),B=document.getElementById('b'),M=document.getElementById('m');
const bar=f=>{B.style.width=Math.round(f*100)+'%';};
let got=null,opened=false,forwarded=false;
function payload(){return got=got||fetch(D.u).then(async r=>{if(!r.ok)throw new Error('download failed ('+r.status+')');const n=+r.headers.get('content-length')||0;if(!r.body||!n){const b=new Uint8Array(await r.arrayBuffer());bar(1);return b;}const rd=r.body.getReader();let buf=new Uint8Array(n),o=0;for(;;){const x=await rd.read();if(x.done)break;if(o+x.value.length>buf.length){const g=new Uint8Array(Math.max(buf.length*2,o+x.value.length));g.set(buf.subarray(0,o));buf=g;}buf.set(x.value,o);o+=x.value.length;bar(Math.min(1,o/n));}bar(1);return buf.subarray(0,o);}).catch(e=>{got=null;throw e;});}
const cleanHash=()=>(location.hash||'').replace(/[#&]?k=[^&]*&?/,'#').replace(/#$/,'');
async function open_(){if(opened)return;opened=true;M.textContent='Opening the studio…';try{
const key=await crypto.subtle.importKey('raw',u(D.k),{name:'AES-GCM'},true,['decrypt']);const all=await payload();const dec=await crypto.subtle.decrypt({name:'AES-GCM',iv:all.subarray(0,12)},key,all.subarray(12));
const pt=new Uint8Array(await new Response(new Blob([dec]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
const base=location.href.replace(/[#?].*$/,'').replace(/[^/]*$/,'');const te=new TextEncoder();const inj=te.encode('<script>window.DPS='+JSON.stringify({base:base,key:D.k,packs:D.p})+';<\/script>');
const mm=/^\s*<!doctype[^>]*>/i.exec(new TextDecoder().decode(pt.subarray(0,200)));const cut=mm?te.encode(mm[0]).length:0;
const url=URL.createObjectURL(new Blob([pt.subarray(0,cut),inj,pt.subarray(cut)],{type:'text/html;charset=utf-8'}));const h=cleanHash();if(h!==(location.hash||''))history.replaceState(null,'',location.pathname+location.search+h);
document.title='Dolman Preview Studio';document.body.innerHTML='';document.body.style.cssText='margin:0;display:block;background:#0d1117';const fr=document.createElement('iframe');fr.title='Dolman Preview Studio';fr.src=url+h;fr.allow='clipboard-write';fr.style.cssText='position:fixed;inset:0;width:100%;height:100%;border:0';document.body.appendChild(fr);fr.focus();
addEventListener('message',e=>{if(e.source===fr.contentWindow&&e.data&&e.data.type==='route')history.replaceState(null,'',location.pathname+location.search+e.data.hash);});
}catch(x){opened=false;E.textContent='Could not open the studio: '+((x&&x.message)||x);}}
/* past links forward to the newest build once per tab; Back returns to this snapshot and stays */
async function newest(){const fk='dps.fwd.'+D.b;try{if(sessionStorage.getItem(fk))return null;}catch(e){return null;}
try{const c=new AbortController();const t=setTimeout(()=>c.abort(),4000);const r=await fetch(D.latest+'?t='+Date.now(),{cache:'no-store',signal:c.signal});clearTimeout(t);if(!r.ok)return null;const L=await r.json();
if(L&&L.build&&L.url&&L.build!==D.b&&L.build>D.b){try{sessionStorage.setItem(fk,'1');}catch(e){}return L.url;}}catch(e){}return null;}
addEventListener('pageshow',e=>{if(e.persisted&&forwarded&&!opened){forwarded=false;open_();}});
(async()=>{if(!('DecompressionStream' in window)){E.textContent='Please open this link in a current Chrome, Edge, Safari or Firefox.';return;}
const nx=await newest();if(nx){forwarded=true;M.textContent='Opening the newest version…';location.assign(nx+cleanHash());return;}
payload().catch(()=>{});open_();})();
</script></body></html>
