<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Dolman Preview Studio</title>
<style>:root{color-scheme:dark}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d1117;color:#e6edf3;font:15px/1.5 "JetBrains Mono",ui-monospace,Consolas,monospace}
form{width:min(420px,calc(100vw - 32px));display:grid;gap:12px;padding:28px;border:1px solid #30363d;border-radius:14px;background:#161b22}
h1{margin:0;font:800 20px system-ui,sans-serif}p{margin:0;color:#9da7b3;font-size:13px}input{background:#0d1117;border:1px solid #30363d;color:#e6edf3;border-radius:8px;padding:11px 12px;font:inherit}
button{background:#e3b341;color:#1a1405;border:0;border-radius:8px;padding:11px;font:800 14px system-ui,sans-serif;cursor:pointer}.err{color:#ff7b72;min-height:1.2em}
.bar{height:3px;background:#30363d;border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#e3b341;transition:width .2s}</style></head>
<body><form id="f"><h1>Dolman Preview Studio</h1><p>Private review build. Enter the passphrase you were given.</p><input id="pw" type="password" autocomplete="current-password" placeholder="passphrase" aria-label="Passphrase" autofocus><button type="submit">Open</button><div class="bar" title="Downloading the studio"><i id="b"></i></div><p class="err" id="e" role="alert"></p></form>
<script>
const D={s:"2jqjgx/6iNgWzdHodWgfhQ==",n:310000,u:"m/studio.bin",p:{"bf": "m/bf.bin", "bffal": "m/bffal.bin", "bflln": "m/bflln.bin", "hero": "m/hero.bin", "pages-dolman": "m/pages-dolman.bin", "pages-fal": "m/pages-fal.bin", "pages-lln": "m/pages-lln.bin"}};
const u=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0)),E=document.getElementById('e'),B=document.getElementById('b');
let got=null;
const bar=f=>{B.style.width=Math.round(f*100)+'%';};
function payload(){return got=got||fetch(D.u).then(async r=>{if(!r.ok)throw new Error('download failed ('+r.status+')');const n=+r.headers.get('content-length')||0;if(!r.body||!n){const b=new Uint8Array(await r.arrayBuffer());bar(1);return b;}const rd=r.body.getReader();let buf=new Uint8Array(n),o=0;for(;;){const x=await rd.read();if(x.done)break;if(o+x.value.length>buf.length){const g=new Uint8Array(Math.max(buf.length*2,o+x.value.length));g.set(buf.subarray(0,o));buf=g;}buf.set(x.value,o);o+=x.value.length;bar(Math.min(1,o/n));}bar(1);return buf.subarray(0,o);}).catch(e=>{got=null;throw e;});}
const why=(x,bad)=>x&&x.name==='OperationError'?bad:'Could not open the studio: '+((x&&x.message)||x);
async function keyFrom(pw){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);}
async function open_(key){const all=await payload();const dec=await crypto.subtle.decrypt({name:'AES-GCM',iv:all.subarray(0,12)},key,all.subarray(12));
const pt=new Uint8Array(await new Response(new Blob([dec]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());const raw=new Uint8Array(await crypto.subtle.exportKey('raw',key));const kb=btoa(String.fromCharCode.apply(null,raw));try{sessionStorage.setItem('dps.k',kb);}catch(e){}
const base=location.href.replace(/[#?].*$/,'').replace(/[^/]*$/,'');const te=new TextEncoder();const inj=te.encode('<script>window.DPS='+JSON.stringify({base:base,key:kb,packs:D.p})+';<\/script>');
const m=/^\s*<!doctype[^>]*>/i.exec(new TextDecoder().decode(pt.subarray(0,200)));const cut=m?te.encode(m[0]).length:0;
const url=URL.createObjectURL(new Blob([pt.subarray(0,cut),inj,pt.subarray(cut)],{type:'text/html;charset=utf-8'}));document.title='Dolman Preview Studio';document.body.innerHTML='';document.body.style.cssText='margin:0;display:block;background:#0d1117';const fr=document.createElement('iframe');fr.title='Dolman Preview Studio';fr.src=url+(location.hash||'');fr.allow='clipboard-write';fr.style.cssText='position:fixed;inset:0;width:100%;height:100%;border:0';document.body.appendChild(fr);fr.focus();addEventListener('message',e=>{if(e.source===fr.contentWindow&&e.data&&e.data.type==='route')history.replaceState(null,'',location.pathname+location.search+e.data.hash);});}
async function fromStore(){try{const k=sessionStorage.getItem('dps.k');if(!k)return false;const key=await crypto.subtle.importKey('raw',u(k),{name:'AES-GCM'},true,['decrypt']);await open_(key);return true;}catch(e){return false;}}
async function boot(){const m=/[#&]k=([^&]+)/.exec(location.hash);if(m){const pw=decodeURIComponent(m[1]);history.replaceState(null,'',location.pathname+location.search+location.hash.replace(/[#&]?k=[^&]+&?/,'#').replace(/#$/,''));E.textContent='Opening…';try{await open_(await keyFrom(pw));return;}catch(x){E.textContent=why(x,'That link’s passphrase did not work.');}}if(await fromStore())return;}
document.getElementById('f').addEventListener('submit',async ev=>{ev.preventDefault();E.textContent='Opening…';try{await open_(await keyFrom(document.getElementById('pw').value.trim()));}catch(x){E.textContent=why(x,'Wrong passphrase.');}});
if(!('DecompressionStream' in window)){E.textContent='Please open this link in a current Chrome, Edge, Safari or Firefox.';}else{payload().catch(()=>{});boot();}
</script></body></html>
